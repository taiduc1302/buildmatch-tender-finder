name: Feature request
description: Propose a scoped improvement
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What problem or workflow gap should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define done.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and constraints
      description: Note compatibility, data-quality, privacy, or maintenance concerns.

name: Tender Finder Offline CI

on:
  push:
    branches:
      - main
      - stabilize/internal-weekly-beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    name: Offline verification (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TENDER_FINDER_GUI_SKIP_E2E: "1"
      TENDER_FINDER_DEMO_NO_OPEN: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install offline-test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax and import checks (network denied)
        shell: pwsh
        run: python scripts/offline_ci_check.py

      - name: Authoritative offline Self-Test
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "tenderfinder-offline-ci"
          python -u "01 Code/CONNECTOR_SWEEP/tenderfinder_self_test.py" --root $env:GITHUB_WORKSPACE --output-root $outputRoot
